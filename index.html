<!DOCTYPE html>
<html lang="it" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Appuntamenti</title>
    <style>
        :root { --primary-color: #007bff; --text-color: #333; --bg-color: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .calendar-container { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 350px; margin-bottom: 20px; box-sizing: border-box; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-header h2 { margin: 0; font-size: 1.2rem; color: var(--text-color); text-transform: capitalize; }
        .btn-nav { background: none; border: 1px solid #ddd; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-nav:hover { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .weekdays-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; color: #666; margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 5px; }
        .day-cell { padding: 10px 0; border-radius: 6px; cursor: pointer; position: relative; }
        .day-cell:hover:not(.empty) { background-color: #e9ecef; }
        .day-cell.today { background-color: var(--primary-color); color: white; font-weight: bold; }
        .day-cell.has-event::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; background-color: #ffc107; border-radius: 50%; }
        .day-cell.today.has-event::after { background-color: white; }
        .day-cell.empty { cursor: default; }
        .event-panel { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 350px; box-sizing: border-box; }
        .event-panel h3 { margin-top: 0; font-size: 1.1rem; }
        .event-panel textarea { width: 100%; height: 80px; margin: 10px 0; padding: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; resize: none; }
        .btn-save { background-color: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <button class="btn-nav" id="prev-btn">&lt;</button>
            <h2 id="month-year-display"></h2>
            <button class="btn-nav" id="next-btn">&gt;</button>
        </div>
        <div class="weekdays-grid">
            <div>Lu</div><div>Ma</div><div>Me</div><div>Gi</div><div>Ve</div><div>Sa</div><div>Do</div>
        </div>
        <div class="days-grid" id="days-container"></div>
    </div>
    <div class="event-panel">
        <h3 id="selected-date-label">Seleziona un giorno</h3>
        <textarea id="event-input" placeholder="Scrivi qui i tuoi impegni..."></textarea>
        <button class="btn-save" id="save-btn">Salva Appuntamento</button>
    </div>
    <script>
        const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
        let currentDate = new Date();
        let selectedDateStr = "";
        let events = JSON.parse(localStorage.getItem('calendar_events')) || {};
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('month-year-display').innerText = `${monthNames[month]} ${year}`;
            const firstDayIndex = new Date(year, month, 1).getDay();
            const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const daysContainer = document.getElementById('days-container');
            daysContainer.innerHTML = '';
            for (let i = 0; i < adjustedFirstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('day-cell', 'empty');
                daysContainer.appendChild(emptyCell);
            }
            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.classList.add('day-cell');
                dayCell.innerText = day;
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) { dayCell.classList.add('today'); }
                if (events[dateKey]) { dayCell.classList.add('has-event'); }
                dayCell.addEventListener('click', () => selectDate(dateKey, day, month, year));
                daysContainer.appendChild(dayCell);
            }
        }
        function selectDate(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            document.getElementById('selected-date-label').innerText = `Impegni del ${day} ${monthNames[month]} ${year}`;
            document.getElementById('event-input').value = events[dateKey] || "";
        }
        document.getElementById('save-btn').addEventListener('click', () => {
            if (!selectedDateStr) { alert("Seleziona prima un giorno dal calendario!"); return; }
            const text = document.getElementById('event-input').value.trim();
            if (text) { events[selectedDateStr] = text; } else { delete events[selectedDateStr]; }
            localStorage.setItem('calendar_events', JSON.stringify(events));
            renderCalendar();
            alert("Salvato correttamente!");
        });
        document.getElementById('prev-btn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        document.getElementById('next-btn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
        renderCalendar();
    </script>
</body>
</html>
