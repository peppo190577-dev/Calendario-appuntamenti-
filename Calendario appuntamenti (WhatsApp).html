<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario appuntamenti</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EBDA;--card:#FAF5E9;--ink:#2B3F31;--green:#3F5E48;--sage:#A9BBA0;--bark:#7A664A;--busy:#D9CDB4;--on:#FAF5E9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2A23;--card:#2A382F;--ink:#EDE5D2;--green:#9DB892;--sage:#4B6353;--bark:#C4B393;--busy:#3A4A3F;--on:#1F2A23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F2A23;--card:#2A382F;--ink:#EDE5D2;--green:#9DB892;--sage:#4B6353;--bark:#C4B393;--busy:#3A4A3F;--on:#1F2A23;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:24px 16px 32px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;line-height:1.1;margin:0 0 6px;color:var(--green);font-weight:700}
.sv{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--bark)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:0;font-weight:700}
.nav button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--green);background:transparent;color:var(--green);font-size:20px;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bark);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--card);padding:10px;border-radius:18px}
.w{text-align:center;font-size:12px;font-weight:600;color:var(--bark);padding:4px 0}
.d{aspect-ratio:1;border-radius:12px;border:0;font:600 15px "Nunito Sans",system-ui,sans-serif;background:var(--green);color:var(--on);cursor:pointer}
.d.busy{background:var(--busy);color:var(--bark);text-decoration:line-through}
.d.off{background:transparent;color:var(--bark);opacity:.45;cursor:default}
.d.sel{outline:3px solid var(--bark);outline-offset:1px}
.d.empty{background:transparent;cursor:default}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:14px 2px 6px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:14px;height:14px;border-radius:5px;display:inline-block}
.panel{background:var(--card);border-radius:18px;padding:16px;margin-top:12px;font-size:14px;line-height:1.6}
.panel h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;margin:0 0 10px;color:var(--green)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.s{padding:11px 0;border-radius:12px;border:1.5px solid var(--green);background:transparent;color:var(--green);font:600 15px "Nunito Sans",system-ui,sans-serif;cursor:pointer}
.s.on{background:var(--green);color:var(--on)}
.s:disabled{border-color:var(--busy);color:var(--bark);background:var(--busy);cursor:default;opacity:.7}
.f{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.f input,.f select{padding:12px;border-radius:12px;border:1.5px solid var(--sage);background:var(--bg);color:var(--ink);font:400 16px "Nunito Sans",system-ui,sans-serif}
.go{padding:13px;border:0;border-radius:999px;background:var(--green);color:var(--on);font:600 16px "Nunito Sans",system-ui,sans-serif;cursor:pointer}
.go:disabled{opacity:.5}.d.off{pointer-events:none}
.msg{margin-top:10px;font-weight:600}
.note{font-size:13px;color:var(--bark);margin-top:8px}
.own{margin-top:10px;font-size:13px}
.own button{border:1.5px solid var(--bark);background:transparent;color:var(--bark);border-radius:999px;padding:4px 10px;font:600 12px "Nunito Sans",system-ui,sans-serif;cursor:pointer;margin-left:6px}
</style>
</head>
<body>
<main>
<h1>Prenota il tuo momento di benessere</h1>
<p class="sv">Naturopatia, reiki, riflessologia plantare, floriterapia, shiatsu</p>
<div class="nav"><button id="prev" aria-label="Mese precedente">‹</button><h2 id="title"></h2><button id="next" aria-label="Mese successivo">›</button></div>
<div class="grid" id="grid"></div>
<div class="panel" id="panel"><h3>Scegli un giorno</h3>Lunedì 15:00–19:00<br>Martedì–sabato 9:00–12:30 e 15:00–19:00<br>Domenica chiuso<p class="note">Scegli giorno e ora, poi invia la richiesta su WhatsApp: ti confermo l’appuntamento appena possibile.</p></div>
</main>
<script>
var MONTHS=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
var DAYS=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
var SERV=["Naturopatia","Reiki","Riflessologia plantare","Floriterapia","Shiatsu"];
var MIN=2026*12+10,MAX=2027*12+11,now=new Date(),NUM="393202112073";
var cur=Math.min(Math.max(now.getFullYear()*12+now.getMonth(),MIN),MAX),sel=null,pickT=null;
function dow(y,m,d){return(new Date(y,m,d).getDay()+6)%7}
function times(w){if(w===6)return[];var a=["15:00","16:00","17:00","18:00"];return w===0?a:["09:00","10:00","11:00"].concat(a)}
function past(y,m,d,t){var h=t.split(":");return new Date(y,m,d,+h[0],+h[1])<now}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
  var y=Math.floor(cur/12),m=cur%12;
  document.getElementById("title").textContent=MONTHS[m]+" "+y;
  document.getElementById("prev").disabled=cur<=MIN;document.getElementById("next").disabled=cur>=MAX;
  var g=document.getElementById("grid");g.innerHTML="";
  ["L","M","M","G","V","S","D"].forEach(function(w){g.appendChild(el("div","w",w))});
  var first=dow(y,m,1),n=new Date(y,m+1,0).getDate();
  for(var i=0;i<first;i++)g.appendChild(el("div","d empty"));
  for(var d=1;d<=n;d++){
    var ts=times(dow(y,m,d)),b=el("button","d",d);b.type="button";
    var open=ts.some(function(t){return !past(y,m,d,t)});
    if(!open){b.className="d off";b.disabled=true}
    if(sel&&sel.y==y&&sel.m==m&&sel.d==d)b.className+=" sel";
    b.setAttribute("aria-label",d+" "+MONTHS[m]);
    if(open)b.onclick=(function(d){return function(){sel={y:y,m:m,d:d};pickT=null;render()}})(d);
    g.appendChild(b)
  }
  panel()
}
function panel(){
  if(!sel)return;var P=document.getElementById("panel");P.innerHTML="";
  P.appendChild(el("h3","",DAYS[dow(sel.y,sel.m,sel.d)]+" "+sel.d+" "+MONTHS[sel.m]));
  var box=el("div","slots");
  times(dow(sel.y,sel.m,sel.d)).forEach(function(t){
    var b=el("button","s"+(pickT===t?" on":""),t.replace(/^0/,""));b.type="button";
    b.disabled=past(sel.y,sel.m,sel.d,t);b.onclick=function(){pickT=t;panel()};box.appendChild(b)
  });
  P.appendChild(box);
  if(!pickT)return;
  var f=el("div","f"),nm=el("input"),sv=el("select"),go=el("a","go","Invia richiesta su WhatsApp");
  nm.placeholder="Il tuo nome";nm.autocomplete="name";
  SERV.forEach(function(s){var o=el("option","",s);o.value=s;sv.appendChild(o)});
  go.target="_blank";go.rel="noopener";go.style.cssText="display:block;text-align:center;text-decoration:none";
  function upd(){var who=nm.value.trim()||"[nome]";
    go.href="https://wa.me/"+NUM+"?text="+encodeURIComponent("Ciao, vorrei prenotare "+sv.value+" "+DAYS[dow(sel.y,sel.m,sel.d)].toLowerCase()+" "+sel.d+" "+MONTHS[sel.m]+" alle "+pickT.replace(/^0/,"")+". Sono "+who+".")}
  nm.oninput=upd;sv.onchange=upd;upd();
  [nm,sv,go].forEach(function(x){f.appendChild(x)});P.appendChild(f);
  P.appendChild(el("p","note","La prenotazione è valida solo dopo la mia conferma."))
}
document.getElementById("prev").onclick=function(){if(cur>MIN){cur--;render()}};
document.getElementById("next").onclick=function(){if(cur<MAX){cur++;render()}};
render();
</script>
</body>
</html>
